<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studyroom</title>
  <!-- Without this the browser requests /favicon.ico on every load and logs a 404. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Studyroom</a>
  </header>
  <main class="page">
    <h1>Subjects</h1>
    <p class="lede">One folder per course, kept in <code>subjects/</code>. Add a course here, then put materials in it from its own page — or straight from Finder.</p>
    <form id="new-subject" class="new-subject">
      <input id="new-subject-name" type="text" maxlength="64" autocomplete="off" placeholder="New subject, e.g. AI221" aria-label="New subject name">
      <button type="submit" class="btn primary">Add subject</button>
    </form>
    <p id="dash-error" class="error" hidden></p>
    <ul id="subjects" class="subject-list" aria-live="polite"><li class="empty">Loading…</li></ul>
  </main>
  <script src="/app.js"></script>
</body>
</html>
